name: Tauri opener patch

on:
  push:
    branches: [main, next]
    paths:
      - patches/tauri/**
      - .github/workflows/tauri-opener-patch.yml
  pull_request:
    paths:
      - patches/tauri/**
      - .github/workflows/tauri-opener-patch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: upstream-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the exact public Tauri base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tauri-apps/tauri
          ref: 7cd71369c00978a3783b6ae3e9972358abbe4ae6 # tauri-v2.11.5
          path: upstream-tauri
          persist-credentials: false
      - name: Check and apply the versioned proposal
        run: |
          git apply --check ../patches/tauri/0001-runtime-owned-new-window-opener.patch
          git apply ../patches/tauri/0001-runtime-owned-new-window-opener.patch
          git diff --check
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: upstream-tauri -> target
          key: tauri-opener-${{ runner.os }}
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt -p tauri-runtime -p tauri --check
      - name: Test runtime-neutral feature and token contract
        run: cargo test -p tauri-runtime --lib --locked
      - name: Compile the core without Wry
        run: cargo check -p tauri --no-default-features --lib --locked
      - name: Test default Wry compatibility and mock-runtime rejection
        run: cargo test -p tauri --lib --tests --features test --locked
