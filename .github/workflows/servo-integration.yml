name: Servo integration policy

on:
  push:
    branches: ['integration/**']
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/servo/**
      - .github/workflows/servo-integration.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - patches/servo/**
      - .github/workflows/servo-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false

jobs:
  fetch-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the versioned public engine pin
        id: engine
        shell: bash
        run: jq -r '"upstream_repository=\(.upstream_repository)\nrepository=\(.repository)\nrevision=\(.revision)\nbranch=\(.branch)\nbase_revision=\(.base_revision)\nahead_by=\(.ahead_by)\nbehind_by=\(.behind_by)\nrust_channel=\(.rust_channel)"' patches/servo/integration.json >> "$GITHUB_OUTPUT"
      - name: Check out the exact public engine revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.revision }}
          path: pinned-servo
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .cargo
            components
            ffi
            ports
            resources
            support
            tests/unit
            tests/capi
      - name: Verify the published branch and v0.5.0 lineage
        working-directory: pinned-servo
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.engine.outputs.revision }}"
          test "$(git ls-remote https://github.com/${{ steps.engine.outputs.repository }}.git refs/heads/${{ steps.engine.outputs.branch }} | cut -f1)" = "${{ steps.engine.outputs.revision }}"
          git fetch "https://github.com/${{ steps.engine.outputs.upstream_repository }}.git" refs/tags/v0.5.0:refs/tags/v0.5.0
          test "$(git rev-parse refs/tags/v0.5.0^{commit})" = "${{ steps.engine.outputs.base_revision }}"
          git merge-base --is-ancestor "${{ steps.engine.outputs.base_revision }}" HEAD
          read -r behind_by ahead_by < <(git rev-list --left-right --count "${{ steps.engine.outputs.base_revision }}...HEAD")
          echo "lineage: ahead_by=$ahead_by behind_by=$behind_by"
          test "$ahead_by" = "${{ steps.engine.outputs.ahead_by }}"
          test "$behind_by" = "${{ steps.engine.outputs.behind_by }}"
          engine_channel="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          embedder_channel="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("../rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          echo "rust channel: servo=$engine_channel turvo=$embedder_channel"
          test "$engine_channel" = "${{ steps.engine.outputs.rust_channel }}"
          test "$embedder_channel" = "${{ steps.engine.outputs.rust_channel }}"
      - name: Verify the ordered versioned patch stack
        shell: bash
        run: |
          patch_check="$RUNNER_TEMP/pinned-servo-patch-check"
          git clone pinned-servo "$patch_check"
          for patch in \
            0007-sendable-web-resource-responders.patch \
            0006-align-jemalloc-consumer-graph.patch \
            0005-storage-engine-factories.patch \
            0004-fix-security-identify-window-backed-requests.patch \
            0003-shared-network-test-runtime.patch \
            0002-cancellation-feature-lockfile.patch \
            0001-policy-preserving-http-interception.patch
          do
            git -C "$patch_check" apply --reverse "$GITHUB_WORKSPACE/patches/servo/$patch"
          done
      - name: Install Linux networking test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libssl-dev lld
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: pinned-servo -> target
          key: servo-policy-${{ runner.os }}
          cache-on-failure: true
      - name: Check new adapter and regression-test formatting
        working-directory: pinned-servo
        run: rustfmt +1.95.0 --edition 2024 --check components/net/request_interceptor.rs components/net/tests/interception.rs
      - name: Check the file-manager fixture in isolation
        working-directory: pinned-servo
        shell: bash
        run: cargo +1.95.0 test -p servo-net --test main --locked filemanager_thread::test_filemanager -- --exact 2>&1 | tee filemanager-test.log
      - name: Run all engine networking regression tests
        working-directory: pinned-servo
        shell: bash
        run: cargo +1.95.0 test -p servo-net --test main --locked 2>&1 | tee net-tests.log
      - name: Run storage engine regression tests
        working-directory: pinned-servo
        shell: bash
        run: cargo +1.95.0 test -p servo-storage --lib --locked 2>&1 | tee storage-tests.log
      - name: Run request-client identity tests
        working-directory: pinned-servo
        shell: bash
        run: cargo +1.95.0 test -p servo-net-traits --test request_client --locked 2>&1 | tee request-client-tests.log
      - name: Retain exact engine test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servo-policy-${{ runner.os }}
          path: |
            pinned-servo/net-tests.log
            pinned-servo/filemanager-test.log
            pinned-servo/storage-tests.log
            pinned-servo/request-client-tests.log
          if-no-files-found: ignore
