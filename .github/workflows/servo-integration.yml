name: Servo integration policy

on:
  push:
    branches: ['integration/**']
    paths:
      - patches/servo/**
      - .github/workflows/servo-integration.yml
  pull_request:
    paths:
      - patches/servo/**
      - .github/workflows/servo-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false

jobs:
  fetch-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the versioned public engine pin
        id: engine
        shell: bash
        run: jq -r '"repository=\(.repository)\nrevision=\(.revision)"' patches/servo/integration.json >> "$GITHUB_OUTPUT"
      - name: Check out the exact public engine revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.revision }}
          path: pinned-servo
          persist-credentials: false
          sparse-checkout: |
            .cargo
            components
            ffi
            ports
            resources
            support
            tests/unit
            tests/capi
      - name: Verify the versioned patch is present
        working-directory: pinned-servo
        run: git apply --reverse --check ../patches/servo/0001-policy-preserving-http-interception.patch
      - name: Install Linux networking test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libssl-dev lld
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: pinned-servo -> target
          key: servo-policy-${{ runner.os }}
          cache-on-failure: true
      - name: Check new adapter and regression-test formatting
        working-directory: pinned-servo
        run: rustfmt +1.94.0 --edition 2024 --check components/net/request_interceptor.rs components/net/tests/interception.rs
      - name: Run all engine networking regression tests
        working-directory: pinned-servo
        shell: bash
        run: cargo +1.94.0 test -p servo-net --test main --locked 2>&1 | tee net-tests.log
      - name: Retain exact engine test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servo-policy-${{ runner.os }}
          path: pinned-servo/net-tests.log
          if-no-files-found: ignore
