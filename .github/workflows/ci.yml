name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Servo's debug artifacts are large and do not improve these correctness
  # checks. Disabling them also keeps hosted runners below their disk limit.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false

jobs:
  format-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
          toolchain: 1.94.0
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check published crate contents
        run: cargo package -p turvo --locked --no-verify

  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Install Servo build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libharfbuzz-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxkbcommon-x11-dev \
            lld
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: ${{ matrix.platform.target }}
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: servo-${{ matrix.platform.target }}

      - name: Test runtime
        run: cargo test -p turvo --lib --tests --locked --target ${{ matrix.platform.target }}

      - name: Lint runtime
        run: cargo clippy -p turvo --lib --tests --locked --target ${{ matrix.platform.target }} -- -D warnings

      - name: Build hello-world example
        run: cargo build -p helloworld --locked --target ${{ matrix.platform.target }}

      - name: Build API parity example
        run: cargo build -p turvo-api --locked --target ${{ matrix.platform.target }}
