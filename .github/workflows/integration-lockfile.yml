name: Integration lockfile candidate

# This read-only helper resolves new public source pins on a roomy runner.
# The artifact must be reviewed and committed; it is not a release/build receipt.
on:
  push:
    branches: ['integration/**']
    paths:
      - Cargo.toml
      - crates/turvo/Cargo.toml
      - patches/servo/integration.json
      - patches/tauri/integration.json
      - .github/workflows/integration-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
      - name: Verify public source metadata
        run: python3 scripts/check_integration.py --metadata-only
      - name: Resolve new sources while retaining other locked versions
        run: cargo update --workspace
      - name: Verify coherent source families
        run: |
          python3 scripts/check_integration.py
          cargo metadata --locked --no-deps --format-version 1
      - name: Retain candidate for review and explicit commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-lockfile-candidate
          path: |
            Cargo.lock
            Cargo.toml
            patches/servo/integration.json
            patches/tauri/integration.json
          if-no-files-found: error
