[workspace]
members = [
  "crates/turvo",
  "examples/api",
  "examples/code-server",
  "examples/helloworld",
  "examples/security",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Travis-Gilbert/Turvo"
repository = "https://github.com/Travis-Gilbert/Turvo"

[workspace.dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["common-controls-v6"] }
tauri-build = { version = "=2.6.3" }
tauri-plugin-shell = "2"
ureq = { version = "3.4", default-features = false }

# Public development integration only. Registry release remains gated by E02;
# published versions do not yet provide these runtime/origin contracts.
[patch.crates-io]
servo = { git = "https://github.com/Travis-Gilbert/servo", rev = "b70d4e64c0005d5dc2d5257c09f997dba235410a" }
servo-net-traits = { git = "https://github.com/Travis-Gilbert/servo", rev = "b70d4e64c0005d5dc2d5257c09f997dba235410a" }
servo-base = { git = "https://github.com/Travis-Gilbert/servo", rev = "b70d4e64c0005d5dc2d5257c09f997dba235410a" }
servo-storage-traits = { git = "https://github.com/Travis-Gilbert/servo", rev = "b70d4e64c0005d5dc2d5257c09f997dba235410a" }
servo-url = { git = "https://github.com/Travis-Gilbert/servo", rev = "b70d4e64c0005d5dc2d5257c09f997dba235410a" }
tauri = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }
tauri-runtime = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }
tauri-utils = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }
tauri-build = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }
tauri-macros = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }
tauri-codegen = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }
tauri-runtime-wry = { git = "https://github.com/Travis-Gilbert/tauri", rev = "e84733018d84c8004645e04cbc8fea8511ae36b1" }

[profile.dev]
debug = 0
incremental = false
