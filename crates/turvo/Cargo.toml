[package]
name = "turvo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A deterministic Tauri desktop runtime backed by an in-process Servo engine"
readme = "../../README.md"
documentation = "https://docs.rs/turvo"
homepage.workspace = true
repository.workspace = true
keywords = ["tauri", "servo", "desktop", "webview", "runtime"]
categories = ["gui", "web-programming"]
build = "build.rs"
exclude = ["/target"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
features = ["devtools", "tracing"]

[dependencies]
# Exact pins are intentional. Turvo's public promise is that a release selects
# one Servo/Tauri pair instead of allowing Cargo to float the renderer.
servo = "=0.5.0"
# Request provenance and body streams are part of the same pinned engine set.
servo-net-traits = "=0.5.0"
tauri.workspace = true
tao = { version = "=0.37.0", default-features = false, features = ["rwh_06"] }
tauri-runtime = "=2.11.3"
tauri-utils = "=2.9.3"

cookie = "0.18"
content-security-policy = "0.8"
dpi = "0.1"
euclid = "0.22"
futures-channel = "0.3"
futures-util = "0.3"
http = "1"
ipc-channel = { version = "0.22", features = ["async"] }
keyboard-types = "0.8.3"
log = "0.4.21"
percent-encoding = "2.3"
raw-window-handle = "0.6"
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
  "logging",
  "std",
  "tls12",
] }
thiserror = "2"
tracing = { version = "0.1", optional = true }
url = "2.5"

[target.'cfg(windows)'.dependencies]
# Surfman's WGL path requires hardware DX interop; use Servo's maintained
# ANGLE backend and the matching mozangle DLL build on Windows.
servo = { version = "=0.5.0", features = ["no-wgl"] }
once_cell = "1.20"
softbuffer = { version = "0.4", default-features = false }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSScreen",
  "NSGraphics",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[features]
default = ["x11", "dbus"]
dbus = ["tao/dbus"]
devtools = ["tauri-runtime/devtools"]
macos-private-api = ["tauri-runtime/macos-private-api"]
macos-proxy = []
# Reserved for consumers that patch Servo with additional engine work.
patched-servo = []
tracing = ["dep:tracing"]
unstable = []
x11 = ["tao/x11"]

[dev-dependencies]
servo-base = "=0.5.0"
